name: Update site

# Runs whenever anything changes on the main branch, and on demand from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Find the site files
        shell: bash
        run: |
          set -e
          # Locate the site files. Works whether they are in folders (pipeline/, web/, ...), inside one extra folder,
          # or uploaded flat with no folders at all (they are then sorted into a working copy).
          run_py=$(find . -path ./.git -prune -o -path ./_project -prune -o -type f -path '*/pipeline/run.py' -print | head -1)
          if [ -n "$run_py" ]; then
            dir=$(dirname "$(dirname "$run_py")")
            rel=${dir#./}; [ "$rel" = "." ] && up="minutes" || up="$rel/minutes"
          else
            if [ -z "$(find . -path ./.git -prune -o -type f -name run.py -print | head -1)" ]; then
              echo "::error title=Site files not found::Could not find run.py anywhere in this repository. Upload all files from the package's stpaul-council-site folder."
              find . -path ./.git -prune -o -type f -print | head -60
              exit 1
            fi
            echo "Files were uploaded without folders; sorting them into the expected layout."
            dir=./_project
            rm -rf "$dir"; mkdir -p "$dir/pipeline" "$dir/web/pages" "$dir/web/vendor" "$dir/narrative" "$dir/minutes"
            pick() { find . -path ./.git -prune -o -path ./_project -prune -o -type f -name "$1" -print | head -1; }
            find . -path ./.git -prune -o -path ./_project -prune -o -type f -name '*.py' -print0 | while IFS= read -r -d '' f; do cp "$f" "$dir/pipeline/"; done
            for n in library.js upload.js print.js shim.js site.css site.js theme.css; do f=$(pick "$n"); [ -n "$f" ] && cp "$f" "$dir/web/"; done
            for n in d3.min.js pdfjs.min.js pdfjs.worker.min.js montserrat-latin-400-normal.woff2 montserrat-latin-500-normal.woff2 montserrat-latin-600-normal.woff2 montserrat-latin-700-normal.woff2 montserrat-latin-800-normal.woff2 chamber-logo.png favicon.png; do f=$(pick "$n"); [ -n "$f" ] && cp "$f" "$dir/web/vendor/"; done
            # every other .html and .js file is a dashboard page; every .csv is an editable narrative file
            find . -path ./.git -prune -o -path ./_project -prune -o -type f \( -name '*.html' -o -name '*.js' \) -print0 | while IFS= read -r -d '' f; do
              case "$(basename "$f")" in library.js|upload.js|print.js|shim.js|site.js|d3.min.js|pdfjs.min.js|pdfjs.worker.min.js) ;; *) cp "$f" "$dir/web/pages/";; esac
            done
            find . -path ./.git -prune -o -path ./_project -prune -o -type f -name '*.csv' -print0 | while IFS= read -r -d '' f; do cp "$f" "$dir/narrative/"; done
            # council member headshots: files named headshot-<member>.jpg / .png / .webp
            mkdir -p "$dir/web/headshots"
            find . -path ./.git -prune -o -path ./_project -prune -o -type f -iname 'headshot-*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 | while IFS= read -r -d '' f; do cp "$f" "$dir/web/headshots/"; done
            find . -path ./.git -prune -o -path ./_project -prune -o -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' f; do cp "$f" "$dir/minutes/"; done
            first_pdf=$(find . -path ./.git -prune -o -path ./_project -prune -o -type f -iname '*.pdf' -print | head -1)
            up=$(dirname "${first_pdf:-./x}"); up=${up#./}; [ "$up" = "." ] && up=""
          fi
          missing=""
          for need in pipeline/run.py pipeline/build_site.py web/print.js web/shim.js web/site.css web/theme.css web/library.js web/upload.js web/site.js web/vendor/d3.min.js \
                      web/pages/voting-trends.html web/pages/member-by-member.html web/pages/playbook.html web/pages/course-of-action.html \
                      narrative/c_members_text.csv narrative/c_priorities.csv narrative/platforms.csv web/pages/platforms.html web/pages/platforms.js; do
            [ -f "$dir/$need" ] || missing="$missing $(basename "$need")"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing files::These files are not in the repository:$missing. Upload them from the package."
            exit 1
          fi
          man=$(find . -path ./.git -prune -o -path ./_project -prune -o -type f -name manifest.txt -print | head -1)
          if [ -n "$man" ]; then
            stale=""
            while read -r sum name; do
              case "$sum" in ''|\#*) continue;; esac
              f=$(find "$dir/pipeline" "$dir/web" -type f -name "$name" | head -1)
              if [ -z "$f" ] || [ "$(sha256sum "$f" | cut -d' ' -f1)" != "$sum" ]; then stale="$stale $name"; fi
            done < "$man"
            if [ -n "$stale" ]; then
              echo "::error title=Outdated or missing files::These files are missing or from an older version:$stale. Upload them again from the latest update (all at once), then this check will pass."
              exit 1
            fi
            echo "All site program files match this update."
          fi
          n=$(find "$dir/minutes" -maxdepth 1 -iname '*.pdf' | wc -l)
          if [ "$n" -eq 0 ]; then echo "::error title=No minutes found::No minutes PDFs in the repository."; exit 1; fi
          echo "Site files ready in '$dir' with $n minutes PDFs. New minutes upload to: '${up:-(top level)}'."
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "MINUTES_UPLOAD_PATH=$up" >> "$GITHUB_ENV"

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Read the minutes and rebuild the data
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 pipeline/run.py

      - name: Build the website
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 pipeline/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PROJECT_DIR }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
